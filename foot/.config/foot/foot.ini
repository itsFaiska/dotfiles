# Configuração Minimalista do Foot - Tema Everblush

# --- FONTE E LAYOUT ---
# Substitua pelo nome exato da Nerd Font que você instalou.
font=JetBrainsMono Nerd Font:size=14
# Aumentar o padding (espaçamento interno) ajuda no visual minimalista
pad=24x24
term=foot

# --- DECORAÇÕES DE JANELA (Wayland) ---
[csd]
# Remove a barra de título da janela (ótimo para Hyprland, Sway, etc.)
preferred=none

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

# --- TEMA EVERBLUSH ---
# Nota: A seção correta no foot é [colors] (e não [colors-dark])
[colors-dark]
alpha=1.0

# Cores principais
foreground=dadada
background=141b1e

# Seleção de texto
selection-foreground=dadada
selection-background=232a2d

# Paleta Normal / Regular
regular0=232a2d  # Black
regular1=e57474  # Red
regular2=8ccf7e  # Green
regular3=e5c76b  # Yellow
regular4=67cbe7  # Blue
regular5=c47fd5  # Magenta
regular6=67cbe7  # Cyan
regular7=bdae93  # White

# Paleta Brilhante / Bright
bright0=2d3437    # Bright Black
bright1=ef7e7e    # Bright Red
bright2=96d988    # Bright Green
bright3=efd175    # Bright Yellow
bright4=71d5f1    # Bright Blue
bright5=ce89df    # Bright Magenta
bright6=71d5f1    # Bright Cyan
bright7=dadada    # Bright White
