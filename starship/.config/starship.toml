# ~/.config/starship.toml

palette = "everblush"

format = """
[╭─](fg:gray)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$c\
$golang\
$nodejs\
$python\
$rust\
$cmd_duration\
$line_break\
[╰─](fg:gray)\
$character"""

# ==========================================
# Everblush
# ==========================================

[palettes.everblush]
bg = "#141b1e"
fg = "#dadada"

black = "#232a2d"
gray = "#6b7678"

red = "#e57474"
green = "#8ccf7e"
yellow = "#e5c76b"
blue = "#67b0e8"
magenta = "#c47fd5"
cyan = "#6cbfbf"
white = "#b3b9b8"


# ==========================================
# Sistema
# ==========================================

[os]
disabled = false
format = "[$symbol ](fg:cyan)"

[os.symbols]
Arch = "󰣇"


# ==========================================
# Usuário
# ==========================================

[username]
show_always = true
style_user = "fg:blue"
style_root = "fg:red"
format = "[$user]($style)"


# ==========================================
# Host
# ==========================================

[hostname]
ssh_only = false
format = "[@](fg:gray)[$hostname](fg:magenta) "
style = "fg:magenta"


# ==========================================
# Diretório
# ==========================================

[directory]
style = "fg:cyan"
read_only_style = "fg:red"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "
truncate_to_repo = false


# ==========================================
# Git
# ==========================================

[git_branch]
symbol = " "
style = "fg:magenta"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:red"
format = "([$all_status$ahead_behind]($style) )"

conflicted = "󰗖 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead}⇣${behind} "
untracked = "${count} "
stashed = " "
modified = "󱇧 "
staged = " "
renamed = "󰑕 "
deleted = " "


# ==========================================
# Duração
# ==========================================

[cmd_duration]
min_time = 500
format = "[󰔚 $duration](fg:yellow) "


# ==========================================
# Prompt
# ==========================================

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"

vimcmd_symbol = "[❮](fg:green)"
vimcmd_replace_one_symbol = "[❮](fg:magenta)"
vimcmd_replace_symbol = "[❮](fg:magenta)"
vimcmd_visual_symbol = "[❮](fg:yellow)"


# ==========================================
# Linguagens
# ==========================================

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰎙 "
style = "fg:green"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:red"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "fg:blue"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:cyan"
format = "[$symbol($version )]($style)"
