# ~/.tmux.conf

# ----------------------------------------
# Configurações Gerais
# ----------------------------------------
# Habilita cores verdadeiras (True Color)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Habilita o uso do mouse (redimensionar painéis, scroll, etc)
set -g mouse on

# Começar numeração de janelas e painéis do 1 (mais fácil de alcançar no teclado)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Reduzir o tempo de atraso do ESC (importante para Neovim/Zsh)
set -s escape-time 0

# ----------------------------------------
# Tema e Estilo (Everblush)
# ----------------------------------------
# Cores de referência Everblush:
# bg = #141b1e | fg = #dadada | black = #232a2d | blue = #67b0e8 | green = #8ccf7e

# Barra de Status
set -g status-style bg="#141b1e",fg="#dadada"
set -g status-position top
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

# Painéis
set -g pane-border-style fg="#232a2d"
set -g pane-active-border-style fg="#67b0e8"

# Mensagens de comando
set -g message-style bg="#232a2d",fg="#8ccf7e"

# Formatação da Barra Esquerda (Sessão)
set -g status-left "#[bg=#67b0e8,fg=#141b1e,bold] 󰆍 #S #[bg=#141b1e,fg=#67b0e8] "

# Formatação das Janelas
set -wg window-status-format "#[bg=#232a2d,fg=#dadada] #I  #W "
set -wg window-status-current-format "#[bg=#8ccf7e,fg=#141b1e,bold] #I  #W #[bg=#141b1e,fg=#8ccf7e]"

# Formatação da Barra Direita (Data e Hora)
set -g status-right "#[fg=#232a2d]#[bg=#232a2d,fg=#dadada] 󰃭 %Y-%m-%d  󰥔 %H:%M "
